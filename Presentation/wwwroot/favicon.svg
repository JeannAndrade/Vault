<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Fundo / Base do cofre -->
  <rect x="6" y="6" width="52" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />

  <!-- Porta do cofre -->
  <rect x="10" y="10" width="44" height="44" rx="4" fill="#334155" stroke="#64748b" stroke-width="2" />

  <!-- Display LCD digital pequenininho na parte superior -->
  <rect x="20" y="14" width="24" height="8" rx="2" fill="#0f172a" stroke="#22c55e" stroke-width="1" />
  <text x="32" y="20" font-family="monospace" font-size="6" fill="#22c55e" text-anchor="middle">888</text>

  <!-- Teclado numérico compacto -->
  <rect x="22" y="26" width="20" height="14" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <!-- Botões do teclado (linhas e colunas simuladas) -->
  <circle cx="26" cy="29" r="1.2" fill="#94a3b8" />
  <circle cx="32" cy="29" r="1.2" fill="#94a3b8" />
  <circle cx="38" cy="29" r="1.2" fill="#94a3b8" />
  <circle cx="26" cy="33" r="1.2" fill="#94a3b8" />
  <circle cx="32" cy="33" r="1.2" fill="#94a3b8" />
  <circle cx="38" cy="33" r="1.2" fill="#94a3b8" />
  <circle cx="26" cy="37" r="1.2" fill="#94a3b8" />
  <circle cx="32" cy="37" r="1.2" fill="#94a3b8" />
  <circle cx="38" cy="37" r="1.2" fill="#94a3b8" />

  <!-- Volante / Maçaneta giratória central na parte inferior -->
  <circle cx="32" cy="47" r="6" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" />
  <circle cx="32" cy="47" r="2" fill="#334155" />
  <!-- Raios do volante -->
  <line x1="32" y1="41" x2="32" y2="53" stroke="#475569" stroke-width="1.5" />
  <line x1="26" y1="47" x2="38" y2="47" stroke="#475569" stroke-width="1.5" />

  <!-- Detalhes de dobradiças nas bordas -->
  <rect x="10" y="16" width="3" height="6" rx="1" fill="#64748b" />
  <rect x="10" y="38" width="3" height="6" rx="1" fill="#64748b" />
</svg>
