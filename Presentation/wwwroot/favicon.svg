<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Fundo / Sombra base do cofre -->
  <rect x="8" y="8" width="48" height="48" rx="8" fill="#1e3a8a" />
  <!-- Azul Cobalto Forte -->

  <!-- Porta do cofre -->
  <rect x="12" y="12" width="40" height="40" rx="4" fill="#2563eb" stroke="#bfdbfe" stroke-width="2" />
  <!-- Azul Vívido com borda Azul Clara -->

  <!-- Maçaneta / Fechadura circular central -->
  <circle cx="32" cy="32" r="8" fill="#fbbf24" stroke="#92400e" stroke-width="2" />
  <!-- Dourado/Amarelo Vibrante com borda Marrom Forte -->

  <!-- Detalhe da fechadura (buraco da chave) -->
  <circle cx="32" cy="32" r="2.5" fill="#1e3a8a" />
  <!-- Centro Azul Cobalto -->

  <!-- Detalhes das dobradiças -->
  <rect x="12" y="18" width="4" height="6" rx="1" fill="#f97316" />
  <!-- Laranja Vívido -->
  <rect x="12" y="40" width="4" height="6" rx="1" fill="#f97316" />
  <!-- Laranja Vívido -->
</svg>
