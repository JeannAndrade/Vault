# Vault: banco, migrations, Api e Web.
# Só o Web é publicado ao host. Banco e Api ficam em redes internas.
# Os valores sensíveis vêm do .env (ignorado pelo git) ou do ambiente do shell;
# se faltar algum obrigatório, o compose falha com a mensagem indicada.
name: vault

services:
  db:
    image: mariadb:12.3.3
    restart: unless-stopped
    networks: [data]
    volumes:
      - db-data:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${VAULT_DB_ROOT:?Defina VAULT_DB_ROOT}
      MARIADB_DATABASE: ${VAULT_DB_NAME:?Defina VAULT_DB_NAME}
      MARIADB_USER: ${VAULT_DB_USER:?Defina VAULT_DB_USER}
      MARIADB_PASSWORD: ${VAULT_DB_PASS:?Defina VAULT_DB_PASS}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s

  migrations:
    image: vault-migrations
    build:
      context: .
      target: migrations
    restart: "no"
    networks: [data]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DBHOST: db
      DBPORT: "3306"
      VAULT_DB_USER: ${VAULT_DB_USER:?Defina VAULT_DB_USER}
      VAULT_DB_PASS: ${VAULT_DB_PASS:?Defina VAULT_DB_PASS}
      VAULT_DB_NAME: ${VAULT_DB_NAME:?Defina VAULT_DB_NAME}
      DBMAJORVERSION: ${DBMAJORVERSION:-12}
      DBMINORVERSION: ${DBMINORVERSION:-3}
      DBBUILDVERSION: ${DBBUILDVERSION:-3}
    depends_on:
      db:
        condition: service_healthy

  api:
    image: vault-api
    build:
      context: .
      target: api
    restart: unless-stopped
    networks: [app, data]
    volumes:
      - api-logs:/app/logs
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DBHOST: db
      DBPORT: "3306"
      VAULT_DB_USER: ${VAULT_DB_USER:?Defina VAULT_DB_USER}
      VAULT_DB_PASS: ${VAULT_DB_PASS:?Defina VAULT_DB_PASS}
      VAULT_DB_NAME: ${VAULT_DB_NAME:?Defina VAULT_DB_NAME}
      DBMAJORVERSION: ${DBMAJORVERSION:-12}
      DBMINORVERSION: ${DBMINORVERSION:-3}
      DBBUILDVERSION: ${DBBUILDVERSION:-3}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  web:
    image: vault-web
    build:
      context: .
      target: web
    restart: unless-stopped
    networks: [edge, app]
    ports:
      - "127.0.0.1:${VAULT_WEB_PORT:-5000}:8080"
    volumes:
      - web-logs:/app/logs
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      VaultApi__BaseAddress: http://api:8080
    depends_on:
      api:
        condition: service_healthy

networks:
  edge: {}            # única rede com acesso externo; é por ela que a porta do Web é publicada
  app:
    internal: true    # Web <-> Api, sem acesso externo
  data:
    internal: true    # Api/migrations <-> banco, sem acesso externo

volumes:
  db-data:
  api-logs:
  web-logs:
